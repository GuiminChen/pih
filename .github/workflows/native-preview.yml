name: native-preview
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pp1-final-link:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install host link prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build g++ libssl-dev libicu-dev
      - name: Link production PP1 model and artifact tools without execution
        run: |
          cmake -S plugins/model-deepseek-v4-flash/link-check -B out/build/pp1-link -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build out/build/pp1-link --target pih-deepseek-pp1-link-check --parallel 2
  native-http-contract-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install standalone contract build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build g++ libssl-dev libgtest-dev
      - name: Compile HTTP contracts without running tests or models
        run: |
          cmake -S . -B out/build/native-contracts -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DPIH_DEPLOYMENT_PROFILE=custom \
            -DPIH_BUILD_WORKER=OFF -DPIH_BUILD_PLUGINS=OFF \
            -DPIH_BUILD_MONOLITH=OFF -DPIH_BUILD_PYTHON=OFF \
            -DPIH_ENABLE_CUDA=OFF -DPIH_ENABLE_NCCL=OFF \
            -DPIH_BUILD_TESTS=OFF -DPIH_BUILD_NATIVE_CONTRACT_TESTS=ON
          cmake --build out/build/native-contracts --target pih-native-contracts --parallel 2
  native-syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install syntax-check prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake ninja-build g++ python3 libssl-dev libarchive-tools
      - name: Prepare pinned headers and native source selection
        run: |
          python3 tools/prepare_linux_syntax_headers.py --tar bsdtar
          cmake -S . -B out/build/syntax -G Ninja \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DPIH_DEPLOYMENT_PROFILE=custom -DPIH_BUILD_WORKER=OFF \
            -DPIH_BUILD_PLUGINS=OFF -DPIH_BUILD_MONOLITH=OFF \
            -DPIH_BUILD_PYTHON=OFF -DPIH_BUILD_TESTS=OFF -DPIH_ENABLE_CUDA=OFF
      - name: Check native model and all PP1 backend adapters without execution
        run: |
          python3 tools/check_native_syntax.py --compiler clang++ \
            --deepseek-model-build out/build/syntax --deepseek-backend --plugin-support
  qwen-v41-syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install syntax-check prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake ninja-build g++ python3 libssl-dev libarchive-tools
      - name: Prepare pinned host and GPU headers without runtime libraries
        run: |
          python3 tools/prepare_linux_syntax_headers.py --tar bsdtar
          python3 tools/prepare_cuda_syntax_headers.py
          python3 tools/prepare_cuda_syntax_headers.py --nccl
          python3 tools/prepare_cublas_syntax_headers.py --tar bsdtar
          cmake -S . -B out/build/qwen-v41-syntax -G Ninja \
            -DPIH_DEPLOYMENT_PROFILE=custom -DPIH_BUILD_WORKER=OFF \
            -DPIH_BUILD_PLUGINS=OFF -DPIH_BUILD_MONOLITH=OFF \
            -DPIH_BUILD_PYTHON=OFF -DPIH_BUILD_TESTS=OFF -DPIH_ENABLE_CUDA=OFF
      - name: Check Qwen and V4.1 source syntax without execution
        run: |
          python3 tools/check_native_syntax.py --compiler clang++ --qwen-model \
            --generated-dir out/build/qwen-v41-syntax/generated
          python3 tools/check_native_syntax.py --compiler clang++ --qwen-qualification
          python3 tools/check_native_syntax.py --compiler clang++ --v41-model
  artifact-tool-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install offline artifact build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build g++ libssl-dev
      - name: Compile native artifact verifier without GPU or Python runtime
        run: |
          cmake -S . -B out/build/artifact -G Ninja \
            -DPIH_DEPLOYMENT_PROFILE=custom -DPIH_BUILD_WORKER=OFF \
            -DPIH_BUILD_PLUGINS=OFF -DPIH_BUILD_MONOLITH=OFF \
            -DPIH_BUILD_PYTHON=OFF -DPIH_BUILD_TESTS=OFF \
            -DPIH_ENABLE_CUDA=OFF -DPIH_BUILD_ARTIFACT_TOOLS=ON
          cmake --build out/build/artifact --target pih-deepseek-artifact-verify pih-deepseek-artifact-prepare pih-deepseek-generation-store pih_deepseek_identity_copy pih_deepseek_v41_config --parallel 2
  tokenizer-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install tokenizer build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build g++ libssl-dev libicu-dev
      - name: Compile native tokenizer without CUDA or Python runtime
        run: |
          cmake -S . -B out/build/tokenizer -G Ninja \
            -DPIH_DEPLOYMENT_PROFILE=custom -DPIH_BUILD_WORKER=OFF \
            -DPIH_BUILD_PLUGINS=OFF -DPIH_BUILD_MONOLITH=OFF \
            -DPIH_BUILD_PYTHON=OFF -DPIH_BUILD_TESTS=OFF \
            -DPIH_ENABLE_CUDA=OFF -DPIH_BUILD_TOKENIZER_TOOLS=ON
          cmake --build out/build/tokenizer --target pih-tokenize pih-qwen-format pih-deepseek-format pih-deepseek-semantic-verify --parallel 2
      - name: Compile native DeepSeek PP1 model objects without CUDA execution
        run: |
          cmake --build out/build/tokenizer --target pih_model_deepseek_v4_flash_impl pih_cuda_deepseek_v4_flash_impl pih_native_model_support --parallel 2
  external-plugin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify SDK source declarations
        run: python3 tools/verify_plugin_sdk_install.py --source-only
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build g++ libssl-dev
      - name: Build and execute native worker smoke
        run: |
          cmake --preset phase1-native
          cmake --build --preset phase1-native --parallel 2
      - name: Install standalone SDK and relocate consumer
        run: |
          cmake --install out/build/phase1-native --prefix "$RUNNER_TEMP/pih-sdk" --component pih-plugin-sdk
          python3 tools/verify_plugin_sdk_install.py "$RUNNER_TEMP/pih-sdk"
          cp -R examples/external-plugin "$RUNNER_TEMP/external-plugin"
          cmake -S "$RUNNER_TEMP/external-plugin" -B "$RUNNER_TEMP/plugin-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/pih-sdk" \
            -DPIH_WORKER="$PWD/out/build/phase1-native/pih-worker"
          cmake --build "$RUNNER_TEMP/plugin-build" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/plugin-build" --output-on-failure
          cmake --build "$RUNNER_TEMP/plugin-build" --target smoke
  qwen-artifact-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install CPU converter prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build g++ libssl-dev binutils
      - name: Compile and link CPU converter without executing it
        run: |
          cmake -S . -B out/build/qwen-artifact -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DPIH_DEPLOYMENT_PROFILE=custom \
            -DPIH_ENABLE_CUDA=OFF -DPIH_ENABLE_NCCL=OFF \
            -DPIH_BUILD_NATIVE_ENGRAM_NCCL=OFF -DPIH_BUILD_MONOLITH=OFF \
            -DPIH_BUILD_PYTHON=OFF -DPIH_BUILD_TESTS=OFF \
            -DPIH_BUILD_PLUGINS=OFF -DPIH_BUILD_WORKER=OFF \
            -DPIH_BUILD_TOKENIZER_TOOLS=OFF -DPIH_BUILD_ARTIFACT_TOOLS=OFF \
            -DPIH_BUILD_QWEN_ARTIFACT_TOOLS=ON
          cmake --build out/build/qwen-artifact --target pih-qwen-int4-convert pih-qwen-int4-verify pih-qwen-source-verify --parallel 2
          readelf -d out/build/qwen-artifact/plugins/offline-qwen/pih-qwen-int4-convert > out/build/qwen-artifact/dynamic.txt
          if grep -E 'NEEDED.*lib(cuda|cudart|cublas|nccl|python)' out/build/qwen-artifact/dynamic.txt; then
            echo 'unexpected runtime dependency in CPU converter' >&2
            exit 1
          fi
  container-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build and run CPU preview container
        run: |
          docker build --file deploy/Dockerfile.preview --tag pih-preview:ci .
          docker run --rm --network none --read-only --cap-drop ALL pih-preview:ci
